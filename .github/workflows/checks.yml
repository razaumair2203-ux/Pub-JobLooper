name: checks

# CONTRIBUTING.md requires the check suite before every commit. This enforces it
# rather than relying on developer discipline.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in README.md; 3.12 is the current dev target.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/check_repo.py inspects git attributes and ignore rules.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show engine diagnosis
        run: python jl.py doctor
        # `doctor` can report governed personal truth awaiting review or missing
        # PDF automation in CI; diagnosis is informative here.
        continue-on-error: true

      - name: Run functional and safety checks
        run: python -B tools/run_checks.py full --skip-public-mirror-drift

      - name: Report public-release freshness
        run: python -B tools/check_repo.py --mirror-drift
        # A stale public release must stay visible, but it is a release-readiness
        # condition rather than evidence that the private engine is defective.
        continue-on-error: true
